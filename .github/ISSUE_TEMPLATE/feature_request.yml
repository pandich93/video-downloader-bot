name: Feature request
description: Suggest an idea for the bot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine it working. Mockups of the bot's buttons are welcome.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is not about bypassing DRM, paywalls or downloading content without permission (such requests are closed).
          required: true
